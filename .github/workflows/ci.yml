name: CI

# Every push and PR on the working branches. `the-life` is the active build branch (Wave 2:
# production truth) — CI that never ran there was the gap this workflow closes.
on:
  push:
    branches: [main, the-life, "phase-*"]
  pull_request:
    branches: [main, the-life, "phase-*"]

# One run per branch; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  js:
    name: JS (typecheck · lint · unit · web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bunx biome check .

      # Workspace unit suites: packages/* + apps/web-pwa (bun test, Playwright specs excluded by
      # the app's own `test` script filter).
      - run: bun run test

      # The web build is a compile gate, never deployed from here. The committed public flags in
      # apps/web-pwa/.env.production are overridden to the keyless mock provider so no CI artifact
      # is ever a live-mode bundle and the build needs no endpoints or keys.
      - name: Build web app
        working-directory: apps/web-pwa
        env:
          VITE_LLM_MODE: mock
          VITE_GATEWAY_URL: ""
        run: bun run build

  e2e:
    name: E2E (Playwright journey suite)
    runs-on: ubuntu-latest
    # TODO(wave-3): drop continue-on-error. The journey + capabilities specs are stale against the
    # current UI (aria-labels changed in the design polish pass, e.g. "You — profile and settings"
    # is now "You — level N, profile and settings"), so 5 of 6 fail locally today. Wave 3 owns the
    # spec fixes; until then this job reports without gating the branch.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        working-directory: apps/web-pwa
        run: bunx playwright install --with-deps chromium

      # playwright.config.ts owns the server: it starts vite on a strict port with
      # VITE_LLM_MODE=mock, no gateway, dev auth and local persistence — hermetic, no services.
      - name: Run journey suite
        working-directory: apps/web-pwa
        env:
          CI: "true"
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web-pwa/playwright-report
            apps/web-pwa/test-results
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: Python (ruff · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      # One uv workspace at the repo root; --all-packages resolves every member service.
      - run: uv sync --all-packages

      - run: uvx ruff check services content

      - name: pytest — gateway
        run: uv run pytest -q services/gateway

      - name: pytest — verifier
        run: uv run pytest -q services/verifier

      - name: pytest — contracts
        run: uv run pytest -q services/contracts

      - name: pytest — content
        run: uv run pytest -q content

  render-worker:
    name: Render worker (bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-rw-${{ runner.os }}-${{ hashFiles('services/render-worker/bun.lock') }}
          restore-keys: bun-rw-${{ runner.os }}-

      # Deliberately not a workspace member (Remotion's heavy deps stay isolated), so it installs
      # and tests on its own.
      - name: Install
        working-directory: services/render-worker
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: services/render-worker
        run: bun test
