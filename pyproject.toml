[project]
name = "classess-learner-workspace"
version = "0.0.0"
description = "Classess Learner — Python services workspace (BFF, gateway, verifier, Plexus)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv.workspace]
# Members are added as each Python package is created. Globbing avoids editing this on every add.
# content/catalogs is data (board catalog JSON), not a Python package — excluded.
members = ["services/*", "content/*"]
exclude = ["content/catalogs"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Prompt- and data-heavy modules: an LLM system prompt, a calibration dataset, and spike prose
# have legitimately long lines. E501 is noise there; all real code-quality lints stay enforced.
"content/atom/**" = ["E501"]
"services/gateway/src/classess_gateway/vidya.py" = ["E501"]
"services/gateway/tests/test_vidya.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["services", "content"]
