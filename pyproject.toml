[project]
name = "wobo-workspace"
version = "0.0.0"
description = "Wobo — Python services workspace (BFF, gateway, verifier, Plexus)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv.workspace]
# services/* is globbed because a service is a Python package by definition; content/ is not.
# Everything under content/ is data or a standalone build script — board catalogs, the Plexus
# artifact cache, the NCERT fact-base, the framework registry seed, the hospitality calendars —
# and exactly one directory, content/atom, is a real uv package. Naming it rather than globbing
# `content/*` with a growing exclude list means the next data directory someone adds does not
# break `uv sync --all-packages` on the day it lands. Add a line here when a content directory
# genuinely becomes a package (i.e. gains a pyproject.toml).
#
# services/render-worker has no pyproject.toml (a Node/TS render service with a Python queue
# consumer), so it is excluded — otherwise every `uv run` fails trying to resolve it as a member.
# Drop that exclude if it later becomes a real uv package.
members = ["services/*", "content/atom"]
exclude = ["services/render-worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
# services/render-worker stays OUT of the uv workspace (no pyproject.toml — see above) but its
# Python files are IN the lint path: `uvx ruff check services content` reaches them, so the
# operator-run drain worker gets the same lint gate as everything else. Its TypeScript side is
# covered by the dedicated `render-worker` job in .github/workflows/ci.yml (bun install + bun test).
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Prompt- and data-heavy modules: an LLM system prompt, a calibration dataset, and spike prose
# have legitimately long lines. E501 is noise there; all real code-quality lints stay enforced.
"content/atom/**" = ["E501"]
"services/gateway/src/wobo_gateway/wobo.py" = ["E501"]
# engine prompts + inline SVG/JSON string literals: legitimately long lines, E501 is noise
"services/gateway/src/wobo_gateway/plexus/engines.py" = ["E501"]
# subject validators: doctrine docstrings + inline self-check data (same justification as engines.py)
"services/gateway/src/wobo_gateway/plexus/bio.py" = ["E501"]
"services/gateway/src/wobo_gateway/plexus/social.py" = ["E501"]
"services/gateway/src/wobo_gateway/plexus/maps.py" = ["E501"]
# email templates are inline-styled HTML string literals — long lines are the format, not slop
"services/gateway/src/wobo_gateway/email_templates.py" = ["E501"]
"services/gateway/tests/test_wobo.py" = ["E501"]
# the fact-base builder and its patch script: LLM system prompts, run-command docstrings, and
# embedded Python source strings. Same justification as content/atom/** — every other lint stays on.
"content/factbase/**" = ["E501"]
# the render worker's module docstrings are operator runbook prose (queue contract, the
# "operator-run only" warning). Same justification as content/atom/** — every other lint stays on.
"services/render-worker/**" = ["E501"]
# GENERATED from packages/wobo/src/board/schema.ts (bun run --cwd packages/wobo
# board:codegen). The grammar travels as one JSON literal per schema so the mirror is
# byte-stable; formatting it by hand would be edited away on the next regeneration.
"services/gateway/src/wobo_gateway/board_schema.py" = ["E501", "B905"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["services", "content"]
