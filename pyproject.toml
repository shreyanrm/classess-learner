[project]
name = "classess-learner-workspace"
version = "0.0.0"
description = "Classess Learner — Python services workspace (BFF, gateway, verifier, Plexus)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv.workspace]
# Members are added as each Python package is created (services/contracts, then api,
# gateway, verifier; content/plexus later). Globbing avoids editing this on every add.
members = ["services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["services"]
