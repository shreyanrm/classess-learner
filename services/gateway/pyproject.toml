[project]
name = "classess-gateway"
version = "0.0.0"
description = "Classess model gateway — the single entry for all model calls (capability registry, two-track routing, three-tier cost economy)."
requires-python = ">=3.12"
dependencies = [
    # The live voice relay (voice.py) imports aiohttp for its two upstream websockets. It
    # arrived transitively via litellm; declared here so a litellm dependency change cannot
    # silently break the voice path.
    "aiohttp>=3.9",
    # classess-contracts is NOT declared here: no gateway module imports it. The event contract
    # is validated where events are written — the client's SDK against @classess/contracts — and
    # the gateway has no server-side ingest point to validate at. It still resolves into the
    # image transitively through classess-verifier, so the mirror is there the day one appears.
    "classess-verifier",
    "fastapi>=0.115",
    "litellm>=1.50",
    "pydantic>=2.7",
    # Identity at the door: Supabase JWTs, HS256 (legacy projects) or JWKS RS/ES (new ones).
    # [crypto] pulls `cryptography`, which the asymmetric verify path needs.
    "pyjwt[crypto]>=2.9",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classess_gateway"]

[tool.uv.sources]
classess-verifier = { workspace = true }
