[project]
name = "classess-gateway"
version = "0.0.0"
description = "Classess model gateway — the single entry for all model calls (capability registry, two-track routing, three-tier cost economy)."
requires-python = ">=3.12"
dependencies = [
    "classess-contracts",
    "classess-verifier",
    "fastapi>=0.115",
    "litellm>=1.50",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classess_gateway"]

[tool.uv.sources]
classess-contracts = { workspace = true }
classess-verifier = { workspace = true }
