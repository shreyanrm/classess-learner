[project]
name = "classess-contracts"
version = "0.0.0"
description = "Python mirror of the Classess event contract. Validates events against the JSON Schema bundle emitted from the TS source of truth."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classess_contracts"]
