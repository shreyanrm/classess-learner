[project]
name = "classess-atom"
version = "0.0.0"
description = "The atom (linear equations in one variable): verified content seed, grounded grading, and the perception + grading calibration spike."
requires-python = ">=3.12"
dependencies = ["classess-verifier", "litellm>=1.50", "pydantic>=2.7"]

[tool.uv.sources]
classess-verifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classess_atom"]
