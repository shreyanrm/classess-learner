# Render Blueprint — Classess model gateway (Docker web service). Render web services
# support WebSockets natively, so /v1/voice/relay works unchanged. This and
# services/gateway/fly.toml are alternatives: deploy to one host at a time.
services:
  - type: web
    name: classess-gateway
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./services/gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: ENV
        value: prod
      # Flip to "live" only after the keys below are set — boot fails fast otherwise.
      - key: LLM_MODE
        value: mock
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: LOG_LEVEL
        value: INFO
      # sync: false => set in the Render dashboard; values never enter this repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
